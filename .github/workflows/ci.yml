name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  LINUX_QT_DEPS: >-
    libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1
    libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libfontconfig1
    libdbus-1-3 xvfb

jobs:
  test:
    name: Test · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_QT_DEPS
      - name: Install PC Pet
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Self-test with real windows (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" python -m pcpet --selftest 6
      - name: Self-test with real windows (macOS / Windows)
        if: runner.os != 'Linux'
        run: python -m pcpet --selftest 6

  build:
    name: Build · ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04  # older glibc, so the binary runs on more distros
            name: linux-x64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_QT_DEPS
      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[build]"
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/pcpet.spec
      - name: Smoke-test the build (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a -s "-screen 0 1280x800x24" dist/pcpet --selftest 5
      - name: Smoke-test the build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\pcpet.exe" -ArgumentList "--selftest","5" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
      - name: Smoke-test the build (macOS)
        if: runner.os == 'macOS'
        run: '"dist/PC Pet.app/Contents/MacOS/pcpet" --selftest 5'
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf pcpet-${{ matrix.name }}.tar.gz -C dist pcpet
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\pcpet.exe -DestinationPath pcpet-${{ matrix.name }}.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent "dist/PC Pet.app" pcpet-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v5
        with:
          name: pcpet-${{ matrix.name }}
          path: |
            pcpet-${{ matrix.name }}.zip
            pcpet-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
